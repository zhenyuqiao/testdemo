<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰箱研发全流程一屏图｜交付拆解与能力复用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f7; --panel:#fff; --ink:#1a242b; --muted:#667781; --line:#d5dee4;
  --teal:#0f7f78; --teal-soft:#e6f4f2; --amber:#b86a2b; --amber-soft:#fff3e8;
  --blue:#2a6285; --blue-soft:#e8f2f8; --violet:#5a4d7a; --violet-soft:#f1eef7;
  --red:#a94442; --shadow:0 8px 28px rgba(26,36,43,.08);
  --font:"IBM Plex Sans SC","IBM Plex Sans","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  display:grid; grid-template-rows:52px minmax(0,1fr); overflow:hidden;
}
button,input{font:inherit}
button{cursor:pointer}

/* top bar */
.topbar{
  display:flex; align-items:center; gap:12px; padding:0 14px;
  background:#102833; color:#e8f4f2; border-bottom:1px solid #0a1b22;
  z-index:5;
}
.brand{font-weight:700; letter-spacing:.04em; font-size:14px; white-space:nowrap}
.brand small{display:block; font-weight:500; color:#8fc9c2; font-size:10px; letter-spacing:.12em; margin-top:1px}
.topbar .spacer{flex:1}
.zoom-group,.filter-group{display:flex; gap:4px; align-items:center}
.zoom-group button,.filter-group button,#fitBtn{
  border:1px solid #2d4b55; background:#17343e; color:#d7ebe7;
  border-radius:6px; padding:5px 9px; font-size:12px; min-width:32px;
}
.zoom-group button:hover,.filter-group button:hover,#fitBtn:hover,
.filter-group button.active{background:var(--teal); border-color:var(--teal); color:#fff}
#search{
  width:min(280px,28vw); border:1px solid #2d4b55; background:#0c222a; color:#e8f4f2;
  border-radius:6px; padding:6px 10px; font-size:12px;
}
#search:focus{outline:1px solid var(--teal)}
.hint{color:#7ea8a2; font-size:11px; white-space:nowrap}

/* workspace */
.workspace{position:relative; min-height:0; overflow:hidden; background:
  linear-gradient(#eef2f4,#f3f5f7);
}
.viewport{
  position:absolute; inset:0; overflow:auto;
  display:grid; place-items:center;
}
.canvas{
  transform-origin:center center;
  transition:transform .18s ease;
  padding:18px 20px 28px;
  width:max-content; min-width:100%;
}
.canvas.dragging{transition:none; cursor:grabbing}

.map-shell{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); padding:12px 12px 10px; width:fit-content; margin:0 auto;
}

.legend-row{
  display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
  margin:0 0 10px; padding:0 2px; color:var(--muted); font-size:11px;
}
.legend-row i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle}
.l-plat{background:var(--blue)} .l-plan{background:var(--amber)} .l-dev{background:var(--teal)}
.l-life{background:var(--violet)} .l-sup{background:#6b7c86}

/* main stages row */
.stages{
  display:grid;
  grid-template-columns:repeat(6, minmax(148px, 168px));
  gap:8px;
  align-items:stretch;
}
.stage{
  border:1px solid var(--line); border-radius:10px; background:#fbfcfd;
  display:flex; flex-direction:column; min-width:0; overflow:hidden;
}
.stage-h{
  padding:7px 8px 6px; border-bottom:1px solid var(--line);
  display:flex; flex-direction:column; gap:1px;
}
.stage-h b{
  font-size:10px; letter-spacing:.08em; font-weight:700;
}
.stage-h strong{font-size:13px; line-height:1.25}
.stage.plat .stage-h{background:var(--blue-soft); color:var(--blue)}
.stage.plat .stage-h strong{color:#17384a}
.stage.plan .stage-h{background:var(--amber-soft); color:var(--amber)}
.stage.plan .stage-h strong{color:#6a3d14}
.stage.dev .stage-h{background:var(--teal-soft); color:var(--teal)}
.stage.dev .stage-h strong{color:#0c4f4a}
.stage.life .stage-h{background:var(--violet-soft); color:var(--violet)}
.stage.life .stage-h strong{color:#3d3458}
.stage-body{padding:6px; display:flex; flex-direction:column; gap:4px; flex:1}

.step{
  border:1px solid #e1e8ec; background:#fff; border-radius:7px;
  padding:5px 7px; text-align:left; color:var(--ink);
  transition:border-color .12s, background .12s, transform .12s;
  width:100%;
}
.step:hover{border-color:#9fc9c4; background:#f4fbfa}
.step.active{border-color:var(--teal); background:var(--teal-soft); box-shadow:inset 3px 0 0 var(--teal)}
.step .idx{
  font-size:9px; font-weight:700; letter-spacing:.08em; color:var(--muted);
}
.step .title{display:block; font-size:11.5px; font-weight:600; line-height:1.25; margin-top:1px}
.step .io{
  display:flex; gap:6px; margin-top:3px; font-size:9.5px; color:var(--muted);
}
.step .io span{white-space:nowrap}
.step.hit{outline:2px solid #f0a35a; outline-offset:1px}

/* connectors between stages */
.stages{position:relative}
.stage{position:relative}
.stage:not(:last-child)::after{
  content:""; position:absolute; right:-7px; top:28px; width:6px; height:2px;
  background:#9db0ba; z-index:2;
}

/* support strip */
.support-strip{
  margin-top:10px; border-top:1px dashed #d0d9df; padding-top:8px;
}
.support-strip .label{
  font-size:11px; color:var(--muted); margin:0 0 6px; font-weight:600;
}
.support-pills{display:flex; flex-wrap:wrap; gap:5px}
.pill{
  border:1px solid #d5dee4; background:#f7f9fa; color:#40545e;
  border-radius:999px; padding:4px 9px; font-size:11px;
}
.pill:hover,.pill.active{background:#102833; color:#e8f4f2; border-color:#102833}
.support-mini{
  display:none; margin-top:8px; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:6px; padding:8px; background:#f7f9fa; border:1px solid var(--line); border-radius:8px;
}
.support-mini.show{display:grid}
.support-mini .mini-h{grid-column:1/-1; font-size:12px; font-weight:600; color:#102833; margin:0}
.snode{
  border:1px solid #dde5ea; background:#fff; border-radius:6px; padding:5px 7px; text-align:left;
}
.snode:hover,.snode.active{border-color:var(--teal); background:var(--teal-soft)}
.snode b{display:block; font-size:10px; color:var(--muted)}
.snode strong{display:block; font-size:11px; margin-top:1px; line-height:1.25}
.snode small{display:block; font-size:10px; color:var(--muted); margin-top:2px}

/* detail drawer */
.drawer{
  position:absolute; top:0; right:0; bottom:0; width:min(400px,92vw);
  background:#fff; border-left:1px solid var(--line); box-shadow:-12px 0 30px rgba(0,0,0,.08);
  transform:translateX(105%); transition:transform .22s ease; z-index:8;
  display:flex; flex-direction:column; min-height:0;
}
.drawer.open{transform:translateX(0)}
.drawer-h{
  display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
  border-bottom:1px solid var(--line); background:#f8fafb;
}
.drawer-h .meta{flex:1; min-width:0}
.drawer-h .kicker{font-size:10px; letter-spacing:.1em; color:var(--teal); font-weight:700}
.drawer-h h2{margin:3px 0 4px; font-size:18px; line-height:1.25}
.drawer-h p{margin:0; color:var(--muted); font-size:12px}
#closeDrawer{
  border:1px solid var(--line); background:#fff; border-radius:6px; width:30px; height:30px;
}
.drawer-body{padding:12px 14px 20px; overflow:auto; flex:1}
.block{margin:0 0 12px}
.block h3{margin:0 0 6px; font-size:12px; letter-spacing:.04em; color:#40545e}
.file{
  border:1px solid var(--line); border-left:3px solid var(--teal);
  border-radius:0 8px 8px 0; padding:7px 9px; margin:0 0 6px; background:#fbfcfd;
}
.file strong{display:block; font-size:12px}
.file small{display:block; color:var(--muted); font-size:11px; margin-top:2px}
.sample{
  margin-top:5px; padding:7px 8px; border-radius:6px; background:#102833; color:#c9e8e3;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px;
  white-space:pre-wrap; line-height:1.5;
}
.out-list{margin:0; padding-left:16px; font-size:12px}
.out-list li{margin:3px 0}
.gate{
  background:var(--amber-soft); border-left:3px solid var(--amber);
  padding:8px 10px; border-radius:0 8px 8px 0; font-size:12px; color:#6a3d14;
}
.gate.red{background:#fdecec; border-left-color:var(--red); color:#7a2e2c}
.status{
  display:inline-block; margin-top:6px; font-size:10px; font-weight:700;
  background:var(--teal-soft); color:var(--teal); border-radius:999px; padding:2px 8px;
}
.source{color:var(--muted); font-size:11px; margin-top:10px}
.support-hint{margin-top:10px; font-size:12px; color:#355}
.support-hint button{
  border:0; background:transparent; color:var(--teal); font-weight:700;
  text-decoration:underline; padding:0 2px;
}
.empty-drawer{color:var(--muted); font-size:13px; padding:24px 8px; text-align:center}

.backdrop{
  position:absolute; inset:0; background:rgba(16,40,51,.18); opacity:0; pointer-events:none;
  transition:opacity .2s; z-index:7;
}
.backdrop.show{opacity:1; pointer-events:auto}

@media (max-width:900px){
  body{grid-template-rows:auto minmax(0,1fr); overflow:auto}
  .topbar{flex-wrap:wrap; height:auto; padding:8px 10px; gap:8px}
  .hint{display:none}
  #search{width:100%}
  .workspace{min-height:70vh}
}

/* artifact & capability */
.mode-group{display:flex;gap:4px;align-items:center}
.mode-group button{
  border:1px solid #2d4b55; background:#17343e; color:#d7ebe7;
  border-radius:6px; padding:5px 9px; font-size:12px;
}
.mode-group button.active,.mode-group button:hover{background:var(--teal); border-color:var(--teal); color:#fff}
.cap-panel{
  display:none; margin-top:10px; border:1px solid var(--line); border-radius:10px;
  background:#fbfcfd; padding:10px;
}
.cap-panel.show{display:block}
.cap-panel h3{margin:0 0 8px; font-size:13px}
.cap-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:6px}
.cap-card{
  border:1px solid #dde5ea; background:#fff; border-radius:8px; padding:8px; text-align:left;
}
.cap-card:hover,.cap-card.active{border-color:var(--teal); background:var(--teal-soft)}
.cap-card b{display:block; font-size:10px; color:var(--muted); letter-spacing:.06em}
.cap-card strong{display:block; font-size:12px; margin-top:2px}
.cap-card small{display:block; font-size:10px; color:var(--muted); margin-top:4px; line-height:1.35}
.part{
  border:1px solid var(--line); border-radius:8px; padding:8px 9px; margin:0 0 8px; background:#fff;
}
.part h4{margin:0 0 4px; font-size:12.5px}
.part .meta{display:grid; gap:4px; margin-top:6px}
.tagrow{display:flex; flex-wrap:wrap; gap:4px}
.tag{
  font-size:10px; border-radius:999px; padding:2px 7px; border:1px solid #d5dee4; background:#f7f9fa; color:#40545e;
}
.tag.src{background:#e8f2f8; border-color:#c5dbe8; color:#2a6285}
.tag.plat{background:#e6f4f2; border-color:#b9ded9; color:#0f7f78}
.tag.method{background:#fff3e8; border-color:#efd2b3; color:#b86a2b}
.tag.cap{background:#f1eef7; border-color:#d9d0ea; color:#5a4d7a; cursor:pointer}
.out-btn{
  display:block; width:100%; text-align:left; border:1px solid #e1e8ec; background:#fff;
  border-radius:7px; padding:6px 8px; margin:0 0 5px; font-size:12px;
}
.out-btn:hover,.out-btn.active{border-color:var(--teal); background:var(--teal-soft)}
.out-btn small{display:block; color:var(--muted); font-size:10px; margin-top:2px}
.tabs{display:flex; gap:4px; margin:0 0 10px}
.tabs button{
  border:1px solid var(--line); background:#f7f9fa; border-radius:6px; padding:4px 8px; font-size:11px; color:#40545e;
}
.tabs button.active{background:#102833; color:#e8f4f2; border-color:#102833}
.linklist{margin:6px 0 0; padding-left:16px; font-size:11px; color:#40545e}
.linklist li{margin:3px 0}

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">冰箱研发全流程一屏图<small>ONE-SCREEN PROCESS MAP</small></div>
    <div class="filter-group" role="group" aria-label="主线过滤">
      <button class="active" data-lane="all">全部</button>
      <button data-lane="plat">平台</button>
      <button data-lane="plan">企划</button>
      <button data-lane="dev">开发</button>
      <button data-lane="life">上市</button>
    </div>
    <div class="mode-group" role="group" aria-label="视图模式">
      <button class="active" data-mode="flow">流程全貌</button>
      <button data-mode="capability">共性能力</button>
    </div>
    <input id="search" type="search" placeholder="搜索节点 / 输入 / 输出…" aria-label="搜索">
    <div class="spacer"></div>
    <span class="hint">滚轮缩放 · 拖动画布 · 点击节点看详情</span>
    <div class="zoom-group">
      <button type="button" id="zoomOut" title="缩小">−</button>
      <button type="button" id="fitBtn" title="一屏适配">适配一屏</button>
      <button type="button" id="zoomIn" title="放大">+</button>
    </div>
  </header>

  <div class="workspace">
    <div class="viewport" id="viewport">
      <div class="canvas" id="canvas">
        <div class="map-shell" id="mapShell">
          <div class="legend-row">
            <span><i class="l-plat"></i>平台</span>
            <span><i class="l-plan"></i>单产品企划</span>
            <span><i class="l-dev"></i>产品开发</span>
            <span><i class="l-life"></i>上市与生命周期</span>
            <span><i class="l-sup"></i>下方可展开分流程</span>
            <span>共 <b id="nodeCount">0</b> 个主节点 · 一屏看全貌 · 点输出拆内容块 / 来源 / 方法 · 再抽共性能力</span>
          </div>
          <div class="stages" id="stages"></div>
          <div class="support-strip" id="supportStrip">
            <div class="label">并行分流程（点击展开，不占主线视线）</div>
            <div class="support-pills" id="supportPills"></div>
            <div class="support-mini" id="supportMini"></div>
          </div>
          <div class="cap-panel" id="capPanel">
            <h3>跨节点共性能力 · 点击查看复用机会</h3>
            <p style="margin:0 0 8px;font-size:11px;color:#667781">同一能力若在多个交付物中重复出现，可沉淀为公共平台 / 方法 / 资产，提升复用与方案产出效率。</p>
            <div class="cap-grid" id="capGrid"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <aside class="drawer" id="drawer" aria-live="polite">
      <div class="drawer-h">
        <div class="meta" id="drawerMeta"><div class="empty-drawer">点击任意节点，查看输入 / 输出与关口</div></div>
        <button type="button" id="closeDrawer" aria-label="关闭">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

function sampleText(f){ return (f[2]||'') + (f[3] ? ('\n\n样例：\n' + f[3]) : ''); }
function normalizeName(s){
  return String(s||'').replace(/[《》\s]/g,'').replace(/报告$/,'报告');
}

function findArtifact(outputName){
  const n = normalizeName(outputName);
  for (const [key, art] of Object.entries(artifacts)){
    const keys = [key, ...(art.alias||[])].map(normalizeName);
    if (keys.some(k => n.includes(k) || k.includes(n))) return {key, ...art};
  }
  return null;
}

function artifactUsage(capId){
  const hits = [];
  Object.entries(artifacts).forEach(([doc, art]) => {
    art.parts.forEach(p => {
      if (p.capability === capId) hits.push({doc, part:p.name, nodeIds:art.nodeIds||[]});
    });
  });
  return hits;
}

function matchesQuery(n){
  if(!query) return true;
  const hay = (n.title + n.short + n.desc + JSON.stringify(n.inputs) + JSON.stringify(n.outputs) + (n.source||'')).toLowerCase();
  return hay.includes(query);
}

function renderStages(){
  const total = lanes.reduce((s,l)=>s+l.items.length,0);
  nodeCountEl.textContent = String(total);
  stagesEl.innerHTML = lanes.map(lane => {
    const hidden = laneFilter !== 'all' && lane.lane !== laneFilter;
    const items = lane.items.filter(matchesQuery);
    return `<section class="stage ${lane.cls}" data-lane="${lane.lane}" style="${hidden?'opacity:.28;filter:grayscale(.7)':''}">
      <div class="stage-h"><b>${lane.code}</b><strong>${lane.title}</strong></div>
      <div class="stage-body">
        ${items.map((n,i)=>`
          <button type="button" class="step ${selected && selected.group===lane.id && selected.id===n.id ? 'active':''} ${query && matchesQuery(n)?'hit':''}"
            data-group="${lane.id}" data-id="${n.id}">
            <span class="idx">${String(i+1).padStart(2,'0')}</span>
            <span class="title">${n.title}</span>
            <div class="io"><span>入 ${n.inputs.length}</span><span>出 ${n.outputs.length}</span></div>
          </button>`).join('') || '<div class="empty-drawer" style="padding:8px;font-size:11px">无匹配</div>'}
      </div>

  }).join('');

function findSelected(){
  if(!selected) return null;
  if(selected.group.startsWith('support:')){
    const fid = selected.group.slice(8);

    const row = flow && flow.nodes.find(r => r[0] === selected.id);
    if(!row) return null;
    return {
      kicker: 'SUPPORT · ' + flow.tag,
      title: row[0],
      desc: flow.intro || '并行分流程节点',
      owner: '对应专业 / 项目团队',
      source: flow.source || '',
      inputs: [[row[1], '支线输入', row[1], row[1]]],
      outputs: [row[2]],
      gate: '具体审批、时限与角色需回到原工作表 / 系统确认。',
      supports: []
    };
  }
  const lane = lanes.find(l => l.id === selected.group);
  const n = lane && lane.items.find(item => item.id === selected.id);
  if(!n) return null;
  return {
    ...n,
    kicker: (n.kicker || selected.group) + ' · ' + (lane.title || ''),
    supports: n.supports || nodeSupports[n.id] || []
  };
}

  drawerBody.innerHTML = `
    <div class="tabs">
      <button type="button" class="active" data-dtab="io">输入 / 输出</button>
      <button type="button" data-dtab="break">交付物怎么来的</button>
      <button type="button" data-dtab="cap">相关共性能力</button>
    </div>
    <div data-dpanel="io">
      <div class="block"><h3>输入文件</h3>
        ${(n.inputs||[]).map(f => `<div class="file"><strong>${f[0]}</strong><small>${f[1]||''}</small>
          <div class="sample">${sampleText(f)}</div></div>`).join('') || '<div class="empty-drawer">无</div>'}
      </div>
      <div class="block"><h3>输出产物（点击可拆解）</h3>
        ${(n.outputs||[]).map(o => {
          const a = findArtifact(o);
          return `<button type="button" class="out-btn" data-open-art="${a ? (a.key||o) : ''}" ${a?'':'disabled'}>
            <strong>${o}</strong>
            <small>${a ? '可拆解为 ' + a.parts.length + ' 个内容块 · 查看来源 / 平台 / 方法' : '尚未建拆解（可后续补充）'}</small>
          </button>`;
        }).join('')}
      </div>
      <div class="block"><h3>下一节点前要确认</h3>
        <div class="gate ${red?'red':''}">${n.gate || '—'}</div>
      </div>
    </div>
    <div data-dpanel="break" hidden></div>
    <div data-dpanel="cap" hidden></div>
    <p class="source">${n.source || ''} 拆解与能力映射为业务梳理模型，便于找共性、建公共能力；正式字段以受控模板为准。</p>`;

  const breakPanel = drawerBody.querySelector('[data-dpanel="break"]');
  const capPanelD = drawerBody.querySelector('[data-dpanel="cap"]');
  renderBreakPanel(breakPanel, n);
  renderNodeCapPanel(capPanelD, n);

  drawerBody.querySelectorAll('[data-dtab]').forEach(btn => {
    btn.addEventListener('click', () => {
      drawerBody.querySelectorAll('[data-dtab]').forEach(b => b.classList.toggle('active', b===btn));
      drawerBody.querySelectorAll('[data-dpanel]').forEach(p => p.hidden = p.getAttribute('data-dpanel') !== btn.dataset.dtab);
    });
  });
  drawerBody.querySelectorAll('[data-open-art]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!btn.dataset.openArt) return;
      selectedArtifactKey = btn.dataset.openArt;
      drawerBody.querySelectorAll('[data-dtab]').forEach(b => b.classList.toggle('active', b.dataset.dtab==='break'));
      drawerBody.querySelectorAll('[data-dpanel]').forEach(p => p.hidden = p.getAttribute('data-dpanel') !== 'break');
      renderBreakPanel(breakPanel, n);
    });
  });

  drawer.classList.add('open');
  backdrop.classList.add('show');
}

function renderBreakPanel(el, n){
  // prefer artifact linked to this node or selected
  let artEntry = null;
  if (selectedArtifactKey && artifacts[selectedArtifactKey]) {
    artEntry = {key:selectedArtifactKey, ...artifacts[selectedArtifactKey]};
  } else {
    for (const o of (n.outputs||[])) {
      const a = findArtifact(o);
      if (a) { artEntry = a; selectedArtifactKey = a.key; break; }
    }
    if (!artEntry) {
      for (const [key, art] of Object.entries(artifacts)) {
        if ((art.nodeIds||[]).includes(selected?.id)) { artEntry = {key, ...art}; selectedArtifactKey = key; break; }
      }
    }
  }
  if (!artEntry) {
    el.innerHTML = `<div class="empty-drawer">当前节点输出尚未建“内容块拆解”。可先从「概念工程研究报告」「产品规划书」等节点体验完整链路。</div>`;
    return;
  }
  el.innerHTML = `
    <div class="block">
      <h3>${artEntry.key}</h3>
      <p style="margin:0 0 8px;font-size:12px;color:#667781">${artEntry.summary||''}</p>
      ${artEntry.parts.map(p => `
        <div class="part" id="part-${p.id}">
          <h4>${p.name}</h4>
          <div style="font-size:12px;color:#40545e">${p.content||''}</div>
          <div class="meta">
            <div><span style="font-size:10px;color:#667781">读哪些来源</span><div class="tagrow">${(p.sources||[]).map(s=>`<span class="tag src">${s}</span>`).join('')}</div></div>
            <div><span style="font-size:10px;color:#667781">访问哪些平台</span><div class="tagrow">${(p.platforms||[]).map(s=>`<span class="tag plat">${s}</span>`).join('')}</div></div>
            <div><span style="font-size:10px;color:#667781">用什么方法论生产</span><div class="tagrow">${(p.methods||[]).map(s=>`<span class="tag method">${s}</span>`).join('')}</div></div>
            <div><span style="font-size:10px;color:#667781">归属共性能力</span><div class="tagrow">
              <button type="button" class="tag cap" data-jump-cap="${p.capability}">${capabilities[p.capability]?.title || p.capability}</button>
            </div></div>
          </div>
        </div>`).join('')}
    </div>`;
  el.querySelectorAll('[data-jump-cap]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedCapability = btn.dataset.jumpCap;
      viewMode = 'capability';
      document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode==='capability'));
      applyViewMode();
      renderCapGrid();
      openCapabilityDrawer(selectedCapability);
    });
  });
}

function renderNodeCapPanel(el, n){
  const caps = new Set();
  (n.outputs||[]).forEach(o => {
    const a = findArtifact(o);
    if (a) a.parts.forEach(p => caps.add(p.capability));
  });
  Object.entries(artifacts).forEach(([key, art]) => {
    if ((art.nodeIds||[]).includes(selected?.id)) art.parts.forEach(p => caps.add(p.capability));
  });
  if (!caps.size) {
    el.innerHTML = `<div class="empty-drawer">暂无映射到共性能力。可在交付物拆解中补充。</div>`;
    return;
  }
  el.innerHTML = `<div class="block"><h3>本节点相关共性能力</h3>
    ${[...caps].map(id => {
      const c = capabilities[id];
      const usage = artifactUsage(id);
      return `<button type="button" class="cap-card" data-open-cap="${id}" style="width:100%;margin-bottom:6px">
        <b>CAPABILITY</b><strong>${c?.title||id}</strong>
        <small>出现在 ${usage.length} 处交付内容块 · ${c?.why||''}</small>
      </button>`;
    }).join('')}</div>`;
  el.querySelectorAll('[data-open-cap]').forEach(btn => {
    btn.addEventListener('click', () => openCapabilityDrawer(btn.dataset.openCap));
  });
}

function openCapabilityDrawer(capId){
  const c = capabilities[capId];
  if (!c) return;
  selectedCapability = capId;
  const usage = artifactUsage(capId);
  drawerMeta.innerHTML = `
    <div class="kicker">COMMON CAPABILITY</div>
    <h2>${c.title}</h2>
    <p>${c.why}</p>
    <span class="status">跨 ${usage.length} 处内容块复用</span>`;
  drawerBody.innerHTML = `
    <div class="block"><h3>为什么值得沉淀成公共能力</h3>
      <p style="margin:0;font-size:12px;color:#40545e">${c.reuse}</p></div>
    <div class="block"><h3>统一平台</h3><div class="tagrow">${c.platforms.map(x=>`<span class="tag plat">${x}</span>`).join('')}</div></div>
    <div class="block"><h3>统一方法</h3><div class="tagrow">${c.methods.map(x=>`<span class="tag method">${x}</span>`).join('')}</div></div>
    <div class="block"><h3>可沉淀资产</h3><div class="tagrow">${c.assets.map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>
    <div class="block"><h3>在全流程中的出现位置</h3>
      <ul class="linklist">${usage.map(u => `<li><strong>${u.doc}</strong> → ${u.part}</li>`).join('')}</ul>
    </div>
    <p class="source">找到共性后，优先建公共平台字段、方法模板与资产，而不是每个节点各自生产一份。</p>`;
  drawer.classList.add('open');
  backdrop.classList.add('show');
  renderCapGrid();
}

function renderCapGrid(){
  capGrid.innerHTML = Object.entries(capabilities).map(([id,c]) => {
    const usage = artifactUsage(id);
    return `<button type="button" class="cap-card ${selectedCapability===id?'active':''}" data-cap="${id}">
      <b>出现 ${usage.length} 处</b>
      <strong>${c.title}</strong>
      <small>${usage.slice(0,2).map(u=>u.doc.replace(/[《》]/g,'')+'/'+u.part).join(' · ')}${usage.length>2?' …':''}</small>
    </button>`;
  }).join('');
  capGrid.querySelectorAll('[data-cap]').forEach(btn => {
    btn.addEventListener('click', () => openCapabilityDrawer(btn.dataset.cap));
  });
}

function applyViewMode(){
  if (viewMode === 'capability') {
    capPanel.classList.add('show');
    supportStrip.style.display = 'none';
    renderCapGrid();
  } else {
    capPanel.classList.remove('show');
    supportStrip.style.display = '';
  }
}

function closeDrawer(){
  drawer.classList.remove('open');
  backdrop.classList.remove('show');
}

function applyScale(){
  canvas.style.transform = `scale(${scale})`;
}

function fitToScreen(){
  // reset first to measure natural size
  scale = 1;
  applyScale();
  const shell = document.getElementById('mapShell');
  const pad = 28;
  const availW = viewport.clientWidth - pad;
  const availH = viewport.clientHeight - pad;
  const needW = shell.scrollWidth;
  const needH = shell.scrollHeight;
  const s = Math.min(availW / needW, availH / needH, 1);
  scale = Math.max(0.45, Math.min(1.15, s * 0.98));
  applyScale();
  // center scroll
  requestAnimationFrame(() => {
    const rect = canvas.getBoundingClientRect();
    const vr = viewport.getBoundingClientRect();
    viewport.scrollLeft = Math.max(0, (canvas.scrollWidth * scale - viewport.clientWidth) / 2);
    viewport.scrollTop = Math.max(0, (canvas.scrollHeight * scale - viewport.clientHeight) / 2);
  });
}

document.getElementById('zoomIn').onclick = () => { scale = Math.min(1.8, scale + 0.1); applyScale(); };
document.getElementById('zoomOut').onclick = () => { scale = Math.max(0.4, scale - 0.1); applyScale(); };
document.getElementById('fitBtn').onclick = fitToScreen;
document.getElementById('closeDrawer').onclick = closeDrawer;
backdrop.onclick = closeDrawer;

document.querySelectorAll('[data-lane]').forEach(btn => {
  btn.addEventListener('click', () => {
    laneFilter = btn.dataset.lane;
    document.querySelectorAll('.filter-group [data-lane]').forEach(b => b.classList.toggle('active', b===btn));
    renderStages();
  });
});

searchEl.addEventListener('input', () => {
  query = searchEl.value.trim().toLowerCase();
  renderStages();
});

// wheel zoom
viewport.addEventListener('wheel', (e) => {
  if(!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  scale = Math.min(1.8, Math.max(0.4, scale + (e.deltaY < 0 ? 0.06 : -0.06)));
  applyScale();
}, {passive:false});

// drag pan
let dragging=false, sx=0, sy=0, sl=0, st=0;
viewport.addEventListener('pointerdown', e => {
  if(e.target.closest('button,input,a,.drawer')) return;
  dragging = true;
  canvas.classList.add('dragging');
  sx = e.clientX; sy = e.clientY; sl = viewport.scrollLeft; st = viewport.scrollTop;
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', e => {
  if(!dragging) return;
  viewport.scrollLeft = sl - (e.clientX - sx);
  viewport.scrollTop = st - (e.clientY - sy);
});
viewport.addEventListener('pointerup', () => { dragging=false; canvas.classList.remove('dragging'); });

document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    viewMode = btn.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b===btn));
    applyViewMode();
    if (viewMode === 'capability') fitToScreen();
  });
});

renderStages();
renderSupportPills();
renderSupportMini();
renderCapGrid();
applyViewMode();
window.addEventListener('load', () => setTimeout(fitToScreen, 60));
window.addEventListener('resize', () => { clearTimeout(window.__fitT); window.__fitT=setTimeout(fitToScreen, 120); });
</script>
</body>
</html>
