<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰箱研发流程 · 点开即扩</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --ink:#1b262d; --muted:#6a7c86; --line:#d7e0e6;
  --teal:#0f7f78; --teal2:#e7f5f3; --amber:#b86a2b; --amber2:#fff1e4;
  --blue:#2a6285; --blue2:#e7f1f7; --vio:#5a4d7a; --panel:#fff;
  --font:"IBM Plex Sans SC","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:48px 1fr;overflow:hidden}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:0 14px;background:#123039;color:#e8f4f2}
.top b{font-size:14px}
.top span{font-size:11px;color:#8fbdb7}
.top .sp{flex:1}
.top button{border:1px solid #2d4b55;background:#183940;color:#d8ebe7;border-radius:6px;padding:5px 10px;font-size:12px}
.top button:hover{background:var(--teal);border-color:var(--teal)}

.workspace{position:relative;min-height:0;overflow:auto}
.stage{max-width:1200px;margin:0 auto;padding:18px 16px 40px}

.hint{color:var(--muted);font-size:12px;margin:0 0 14px;line-height:1.5}

/* ===== Level 0: points on a spine ===== */
.flow{
  position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:18px 12px 14px; box-shadow:0 6px 20px rgba(0,0,0,.04);
}
.flow-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:0 0 12px}
.spine-wrap{overflow-x:auto;padding:8px 4px 6px}
.spine{
  display:flex; align-items:flex-start; gap:0; min-width:max-content;
  position:relative; padding:0 8px 8px;
}
.spine::before{
  content:""; position:absolute; left:28px; right:28px; top:24px; height:3px;
  background:linear-gradient(90deg,#9ec9c4,#2a6285,#0f7f78,#b86a2b,#5a4d7a);
  border-radius:2px;
}
.seg{display:flex; flex-direction:column; align-items:center; width:86px; position:relative; z-index:1}
.seg .lane{
  font-size:9px; color:var(--muted); margin-bottom:6px; height:14px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:74px; text-align:center;
}
.dot{
  width:32px; height:32px; border-radius:50%; border:3px solid #fff;
  background:var(--teal); box-shadow:0 0 0 2px #9ec9c4, 0 4px 10px rgba(15,127,120,.25);
  padding:0;
}
.dot.plat{background:var(--blue); box-shadow:0 0 0 2px #9bbfd4, 0 4px 10px rgba(42,98,133,.25)}
.dot.plan{background:var(--amber); box-shadow:0 0 0 2px #e0b78a, 0 4px 10px rgba(184,106,43,.25)}
.dot.dev{background:var(--teal)}
.dot.life{background:var(--vio); box-shadow:0 0 0 2px #b5a8d0, 0 4px 10px rgba(90,77,122,.25)}
.dot:hover{transform:scale(1.12)}
.dot.active{transform:scale(1.18); box-shadow:0 0 0 3px #123039, 0 6px 14px rgba(0,0,0,.2)}
.seg .name{
  margin-top:8px; font-size:11px; font-weight:600; text-align:center;
  line-height:1.25; width:74px; color:var(--ink);
}
.seg .count{font-size:9px;color:var(--muted);margin-top:2px}

/* ===== Expand panels ===== */
.expand{
  display:none; margin-top:14px; border:1px solid var(--line); border-radius:10px;
  background:#fbfcfd; padding:12px;
}
.expand.show{display:block}
.expand h3{margin:0 0 4px; font-size:14px}
.expand .sub{margin:0 0 10px; color:var(--muted); font-size:12px}

.crumbs{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; font-size:11px; color:var(--muted)}
.crumbs button{border:0;background:transparent;color:var(--teal);font-weight:600;padding:0;text-decoration:underline}

.grid-items{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px}
.item{
  text-align:left; border:1px solid var(--line); background:#fff; border-radius:9px;
  padding:10px; transition:.12s;
}
.item:hover{border-color:var(--teal); background:var(--teal2)}
.item.active{border-color:var(--teal); box-shadow:inset 3px 0 0 var(--teal)}
.item .k{font-size:9px; font-weight:700; letter-spacing:.08em; color:var(--muted)}
.item .k.subflow{color:var(--blue)}
.item .k.artifact{color:var(--amber)}
.item strong{display:block; margin-top:3px; font-size:12.5px; line-height:1.3}
.item small{display:block; margin-top:4px; color:var(--muted); font-size:11px; line-height:1.35}

/* subprocess dots */
.subflow-line{display:flex; gap:0; overflow-x:auto; padding:8px 0}
.subflow-line .seg{width:100px}
.subflow-line .dot{width:24px;height:24px;background:#2a6285}
.subflow-line .name{width:96px;font-size:10px}

/* composition */
.parts{display:flex; flex-wrap:wrap; gap:8px}
.part-chip{
  border:1px dashed #c5d3da; background:#fff; border-radius:999px;
  padding:7px 12px; font-size:12px; font-weight:600;
}
.part-chip:hover,.part-chip.active{border-style:solid;border-color:var(--amber);background:var(--amber2)}

/* ===== Fishbone ===== */
.bone-wrap{overflow-x:auto; padding:8px 0 4px}
.bone{
  display:grid; grid-template-columns:1fr 110px 1fr; gap:8px; align-items:center;
  min-width:640px; position:relative; padding:8px 0;
}
.bone::before{
  content:""; position:absolute; left:22%; right:22%; top:50%; height:3px;
  background:linear-gradient(90deg,#9ec9c4,var(--teal),#e0b78a); border-radius:2px;
}
.bone-side{display:flex; flex-direction:column; gap:8px; position:relative; z-index:1}
.bone-side.left{align-items:flex-end}
.bone-side.right{align-items:flex-start}
.bone-card{
  width:min(100%,260px); background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
}
.bone-card h4{margin:0 0 4px; font-size:11px; color:var(--muted); letter-spacing:.06em}
.bone-card ul{margin:0; padding-left:16px; font-size:12px}
.bone-card li{margin:2px 0}
.bone-core{
  position:relative; z-index:2; justify-self:center;
  width:96px; height:96px; border-radius:50%; border:3px solid #fff;
  background:radial-gradient(circle at 30% 25%, #4db8ae, #0f7f78 70%);
  color:#fff; display:grid; place-content:center; text-align:center;
  box-shadow:0 8px 18px rgba(15,127,120,.28); padding:8px;
}
.bone-core b{font-size:9px; letter-spacing:.1em; opacity:.85}
.bone-core strong{font-size:12px; line-height:1.25; margin-top:3px}

.empty{color:var(--muted); font-size:12px; padding:16px; text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>
<header class="top">
  <div><b>点 → 扩交互物 → 再扩组成 / 子流程 → 鱼骨</b><br><span>按层级展开，不靠侧栏说明书</span></div>
  <div class="sp"></div>
  <button type="button" id="resetBtn">回到主线圆点</button>
</header>
<main class="workspace">
  <div class="stage">
    <p class="hint">① 点击主线上的<strong>圆点</strong> → 展开该节点的<strong>交互物</strong>（交付物 / 子流程）。② 再点交互物：若是子流程就展开子流程圆点；若是交付物就展开<strong>组成</strong>。③ 再点组成块 → 出现<strong>鱼骨图</strong>（来源 / 平台 / 方法 / 产出）。</p>

    <section class="flow">
      <div class="flow-title">主线圆点 · 一屏全流程</div>
      <div class="spine-wrap"><div class="spine" id="mainSpine"></div></div>
      <div class="legend">
        <span><i style="background:var(--blue)"></i>平台</span>
        <span><i style="background:var(--amber)"></i>企划</span>
        <span><i style="background:var(--teal)"></i>开发</span>
        <span><i style="background:var(--vio)"></i>上市</span>
      </div>
    </section>

    <!-- L1: 交互物 -->
    <section class="expand" id="level1">
      <div class="crumbs" id="crumbs1"></div>
      <h3 id="l1title"></h3>
      <p class="sub" id="l1sub"></p>
      <div class="grid-items" id="l1items"></div>
    </section>

    <!-- L2: 子流程 or 组成 -->
    <section class="expand" id="level2">
      <div class="crumbs" id="crumbs2"></div>
      <h3 id="l2title"></h3>
      <p class="sub" id="l2sub"></p>
      <div id="l2body"></div>
    </section>

    <!-- L3: 鱼骨 -->
    <section class="expand" id="level3">
      <div class="crumbs" id="crumbs3"></div>
      <h3 id="l3title"></h3>
      <p class="sub" id="l3sub"></p>
      <div class="bone-wrap" id="l3body"></div>
    </section>
  </div>
</main>

function defaultInteractives(point){
  const outs = (point.outputs||[]).slice(0,4).map(o => ({
    type: compositions[o] ? 'artifact' : 'artifact',
    name: o,
    note: compositions[o] ? '可继续展开组成' : '交付/记录类交互物'
  }));
  const special = nodeInteractives[point.id];
  if (special) return special;
  return outs.length ? outs : [{type:'artifact', name:'（待补交互物）', note:'该节点交互物尚未建模'}];
}

function findComp(name){
  if (compositions[name]) return {key:name, ...compositions[name]};
  const n = name.replace(/[《》]/g,'');
  for (const [k,v] of Object.entries(compositions)){
    if (k.replace(/[《》]/g,'').includes(n) || n.includes(k.replace(/[《》]/g,''))) return {key:k, ...v};
  }
  // fuzzy for 初稿/正式
  if (n.includes('产品规划书')) return {key:'正式《产品规划书》', ...compositions['正式《产品规划书》']};
  return null;
}

let selectedPointId = null;
let selectedInteractive = null; // {type,name,flowId?}
let selectedPartId = null;

const mainSpine = document.getElementById('mainSpine');
const level1 = document.getElementById('level1');
const level2 = document.getElementById('level2');
const level3 = document.getElementById('level3');

function pointById(id){ return mainPoints.find(p => p.id === id); }

function renderMain(){
  mainSpine.innerHTML = mainPoints.map(p => `
    <div class="seg">
      <div class="lane">${p.laneName}</div>
      <button type="button" class="dot ${p.lane} ${selectedPointId===p.id?'active':''}" data-id="${p.id}" title="${p.title}"></button>
      <div class="name">${p.title}</div>
      <div class="count">${(nodeInteractives[p.id] ? nodeInteractives[p.id] : (p.outputs||[]).slice(0,4)).length} 交互物</div>
    </div>`).join('');
  mainSpine.querySelectorAll('.dot').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedPointId = btn.dataset.id;
      selectedInteractive = null;
      selectedPartId = null;
      renderMain();
      openLevel1();
      hideLevel(2); hideLevel(3);
      level1.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function crumbs(el, items){
  el.innerHTML = items.map((it,i) => {
    if (!it.on) return `<span>${it.label}</span>`;
    return `<button type="button" data-crumb="${i}">${it.label}</button>`;
  }).join('<span> → </span>');
  el.querySelectorAll('[data-crumb]').forEach(btn => {
    btn.addEventListener('click', () => items[Number(btn.dataset.crumb)].on());
  });
}

function hideLevel(n){
  document.getElementById('level'+n).classList.remove('show');
}

function openLevel1(){
  const p = pointById(selectedPointId);
  if (!p) return;
  level1.classList.add('show');
  document.getElementById('l1title').textContent = p.title + ' · 交互物';
  document.getElementById('l1sub').textContent = '点下面任意交互物继续展开：子流程会走出一串圆点；交付物会展开它的组成。';
  crumbs(document.getElementById('crumbs1'), [
    {label:'主线圆点', on:() => { document.getElementById('resetBtn').click(); }},
    {label:p.title, on:null}
  ]);
  const items = defaultInteractives(p);
  const box = document.getElementById('l1items');
  box.innerHTML = items.map((it,idx) => `
    <button type="button" class="item ${selectedInteractive && selectedInteractive.name===it.name?'active':''}" data-idx="${idx}">
      <div class="k ${it.type==='subflow'?'subflow':'artifact'}">${it.type==='subflow'?'子流程':'交付物 / 交互物'} · 点击展开</div>
      <strong>${it.name}</strong>
      <small>${it.note||''}</small>
    </button>`).join('');
  box.querySelectorAll('.item').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedInteractive = items[Number(btn.dataset.idx)];
      selectedPartId = null;
      openLevel1();
      openLevel2();
      hideLevel(3);
      level2.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function openLevel2(){
  const p = pointById(selectedPointId);
  const it = selectedInteractive;
  if (!p || !it) return;
  level2.classList.add('show');
  crumbs(document.getElementById('crumbs2'), [
    {label:'主线', on:() => document.getElementById('resetBtn').click()},
    {label:p.title, on:() => { selectedInteractive=null; selectedPartId=null; openLevel1(); hideLevel(2); hideLevel(3); }},
    {label:it.name, on:null}
  ]);

  const body = document.getElementById('l2body');
  if (it.type === 'subflow') {
    const flow = supportFlows.find(f => f.id === it.flowId || f.title === it.name || (it.name && f.title && it.name.includes(f.title)));
    document.getElementById('l2title').textContent = (flow?.title || it.name) + ' · 子流程圆点';
    document.getElementById('l2sub').textContent = (flow?.intro || '这是挂在主线节点下的分流程。') + ' 再点子流程节点，可看该步输入输出（简化）。';
    if (!flow) { body.innerHTML = '<div class="empty">未找到子流程定义</div>'; return; }
    body.innerHTML = `<div class="subflow-line">${flow.nodes.map((row,i)=>`
      <div class="seg">
        <button type="button" class="dot" data-si="${i}"></button>
        <div class="name">${row[0]}</div>
      </div>`).join('')}</div>
      <div id="subDetail" class="empty">点击子流程圆点，查看该步的输入 / 输出</div>`;
    body.querySelectorAll('[data-si]').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = flow.nodes[Number(btn.dataset.si)];
        // synthesize a fishbone-like simple view for subprocess step
        selectedPartId = 'sub:'+row[0];
        openLevel3FromSub(row);
      });
    });
    return;
  }

  // artifact composition
  const comp = findComp(it.name);
  document.getElementById('l2title').textContent = it.name + ' · 组成';
  if (!comp) {
    document.getElementById('l2sub').textContent = '该交互物尚未拆组成。可先体验《概念工程研究报告》。';
    body.innerHTML = '<div class="empty">暂无组成模型</div>';
    return;
  }
  document.getElementById('l2sub').textContent = (comp.summary||'') + ' 再点任一组成块 → 鱼骨图。';
  body.innerHTML = `<div class="parts">${comp.parts.map(part => `
    <button type="button" class="part-chip ${selectedPartId===part.id?'active':''}" data-part="${part.id}">${part.name}</button>
  `).join('')}</div>`;
  body.querySelectorAll('[data-part]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedPartId = btn.dataset.part;
      openLevel2();
      openLevel3FromPart(comp, selectedPartId);
      level3.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function openLevel3FromPart(comp, partId){
  const part = comp.parts.find(p => p.id === partId);
  if (!part) return;
  level3.classList.add('show');
  const p = pointById(selectedPointId);
  crumbs(document.getElementById('crumbs3'), [
    {label:'主线', on:() => document.getElementById('resetBtn').click()},
    {label:p.title, on:() => { selectedInteractive=null; selectedPartId=null; openLevel1(); hideLevel(2); hideLevel(3); }},
    {label:selectedInteractive.name, on:() => { selectedPartId=null; openLevel2(); hideLevel(3); }},
    {label:part.name, on:null}
  ]);
  document.getElementById('l3title').textContent = part.name + ' · 鱼骨展开';
  document.getElementById('l3sub').textContent = '左侧是“读什么 / 用什么台 / 什么方法”，中间是组成块，右侧是这块要产出什么。';
  document.getElementById('l3body').innerHTML = `
    <div class="bone">
      <div class="bone-side left">
        <div class="bone-card"><h4>来源（读什么）</h4><ul>${part.sources.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="bone-card"><h4>平台（用什么系统）</h4><ul>${part.platforms.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="bone-card"><h4>方法论</h4><ul>${part.methods.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
      <div class="bone-core"><b>组成块</b><strong>${part.name}</strong></div>
      <div class="bone-side right">
        <div class="bone-card"><h4>产出</h4><ul>${part.outputs.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
    </div>`;
}

function openLevel3FromSub(row){
  level3.classList.add('show');
  const p = pointById(selectedPointId);
  crumbs(document.getElementById('crumbs3'), [
    {label:'主线', on:() => document.getElementById('resetBtn').click()},
    {label:p.title, on:() => { selectedInteractive=null; selectedPartId=null; openLevel1(); hideLevel(2); hideLevel(3); }},
    {label:selectedInteractive.name, on:() => { selectedPartId=null; openLevel2(); hideLevel(3); }},
    {label:row[0], on:null}
  ]);
  document.getElementById('l3title').textContent = row[0] + ' · 子流程步骤鱼骨';
  document.getElementById('l3sub').textContent = '子流程步骤同样用鱼骨看输入与输出。';
  document.getElementById('l3body').innerHTML = `
    <div class="bone">
      <div class="bone-side left">
        <div class="bone-card"><h4>输入</h4><ul><li>${row[1]}</li></ul></div>
      </div>
      <div class="bone-core"><b>子步骤</b><strong>${row[0]}</strong></div>
      <div class="bone-side right">
        <div class="bone-card"><h4>输出</h4><ul><li>${row[2]}</li></ul></div>
      </div>
    </div>`;
  document.getElementById('subDetail').textContent = '当前：' + row[0];
  level3.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('resetBtn').onclick = () => {
  selectedPointId = null; selectedInteractive = null; selectedPartId = null;
  renderMain(); hideLevel(1); hideLevel(2); hideLevel(3);
};

renderMain();

// 默认引导：高亮概念工程点，方便理解

</script>
</body>
</html>
